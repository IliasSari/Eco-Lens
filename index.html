<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Lens</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="map"></div>
    <div id="control-panel">
        <h3>🌿 EcoLens Curator</h3>
        
        <label for="mood-select">Διάθεση (Mood):</label>
        <select id="mood-select">
            <option value="nature">Φύση & Πράσινο (Nature)</option>
            <option value="history">Ιστορία & Πολιτισμός (History)</option>
            <option value="cozy">Χαλάρωση & Καφέ (Cozy)</option>
        </select>

        <label for="time-select">Διαθέσιμος Χρόνος:</label>
        <select id="time-select">
            <option value="30">30 λεπτά (~2 χλμ)</option>
            <option value="60">1 ώρα (~4 χλμ)</option>
            <option value="120">2 ώρες (~7 χλμ)</option>
        </select>

        <button id="generate-btn">Δημιουργία Διαδρομής 🚀</button>
    </div> 
</body>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</html>
